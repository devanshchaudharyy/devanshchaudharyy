<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Devansh Chaudhary — Full-stack developer</title>
  <desc id="desc">Building useful software, from interface to API. Full-stack development, real-time systems and applied AI.</desc>
  <defs>
