    <linearGradient id="accent"><stop stop-color="#55e6d2"/><stop offset="1" stop-color="#7c9fff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#214c65" stop-opacity=".65"/><stop offset="1" stop-color="#214c65" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91a5c5" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <ellipse cx="1020" cy="190" rx="310" ry="280" fill="url(#glow)"/>
  <rect x="48" y="49" width="4" height="20" rx="2" fill="#55e6d2"/>
