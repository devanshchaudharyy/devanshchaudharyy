  <text x="48" y="143" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#f1f6ff">Devansh Chaudhary<tspan fill="#55e6d2">.</tspan></text>
  <text x="50" y="194" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="url(#accent)">Building useful software.</text>
  <text x="50" y="229" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#aabbd3">From thoughtful interfaces to reliable APIs.</text>
  <g font-family="Verdana, sans-serif" font-size="12" letter-spacing="1.2">
    <rect x="50" y="267" width="136" height="35" rx="17.5" fill="#122b35" stroke="#244e57"/><text x="118" y="289" text-anchor="middle" fill="#84e8d8">FULL-STACK</text>
    <rect x="197" y="267" width="142" height="35" rx="17.5" fill="#182840" stroke="#304563"/><text x="268" y="289" text-anchor="middle" fill="#a9c3ff">REAL-TIME</text>
    <rect x="350" y="267" width="149" height="35" rx="17.5" fill="#26223c" stroke="#454065"/><text x="424" y="289" text-anchor="middle" fill="#c9b8ff">APPLIED AI</text>
  </g>
  <text x="50" y="344" font-family="Consolas, monospace" font-size="13" fill="#7088ab">Curiosity → Code → Test → Iterate</text>
